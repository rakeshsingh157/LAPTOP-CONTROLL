<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phone Screen Share</title>
    <style>
        body { margin: 0; background: #111; display: flex; justify-content: center; align-items: center; height: 100vh; color: white; font-family: sans-serif; }
        #viewer { max-width: 100%; max-height: 100vh; border: 2px solid #555; }
        .controls { position: absolute; bottom: 20px; text-align: center; }
        button { background: #00ff00; border: none; padding: 10px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; color: black; font-weight: bold; }
    </style>
</head>
<body>
    <div class="controls" id="overlay">
        <h2>Waiting for phone stream...</h2>
    </div>
    <!-- Simple fallback to display image frames if doing MJPEG-style base64 via WebSocket -->
    <img id="viewer" src="" style="display: none;" />
    <video id="video-viewer" autoplay playsinline style="display: none; max-width: 100%; max-height: 100vh;"></video>

    <script>
        const room = "1234";
        const wsUrl = window.location.protocol.replace('http', 'ws') + "//" + window.location.host + "/api/share/ws/screen/" + room;
        const ws = new WebSocket(wsUrl);

        ws.onopen = () => {
             console.log("Connected to relay");
             document.querySelector("h2").innerText = "Connected! Waiting for stream...";
        };

        ws.onmessage = async (event) => {
             // In a true WebRTC setup we'd relay ICE candidates here.
             // For MJPEG over WebSocket fallback (simpler display):
             const data = event.data;
             if (data.startsWith("data:image")) {
                 document.getElementById("viewer").src = data;
                 document.getElementById("viewer").style.display = "block";
                 document.getElementById("overlay").style.display = "none";
             }
        };
    </script>
</body>
</html>
